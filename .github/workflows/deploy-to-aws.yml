name: Deploy to AWS ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: tin-bot
  ECS_CLUSTER: tin-bot-cluster
  ECS_SERVICE: tin-bot-service-2jgvajgu
  ECS_TASK_DEFINITION: .aws/task-definition.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      PROOF_ARCHIVE_CHANNEL_ID: ${{ secrets.PROOF_ARCHIVE_CHANNEL_ID }}
      DROP_LOG_CHANNEL_ID: ${{ secrets.DROP_LOG_CHANNEL_ID }}
      SYNC_API_BASE_URL: ${{ secrets.SYNC_API_BASE_URL }}
      GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
      GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      ECS_EXECUTION_ROLE_ARN: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure CloudWatch log group exists
        run: aws logs create-log-group --log-group-name /ecs/tin-bot --region $AWS_REGION || true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Prepare task definition
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = {
              "DISCORD_TOKEN": os.environ.get("DISCORD_TOKEN"),
              "DROP_LOG_CHANNEL_ID": os.environ.get("DROP_LOG_CHANNEL_ID"),
              "SYNC_API_BASE_URL": os.environ.get("SYNC_API_BASE_URL"),
              "ECS_EXECUTION_ROLE_ARN": os.environ.get("ECS_EXECUTION_ROLE_ARN"),
          }
          for name, value in required.items():
              if not value:
                  raise RuntimeError(f"Missing required GitHub secret or env var: {name}")

          env_entries = [
              {"name": "DISCORD_TOKEN", "value": os.environ.get("DISCORD_TOKEN", "")},
              {"name": "PROOF_ARCHIVE_CHANNEL_ID", "value": os.environ.get("PROOF_ARCHIVE_CHANNEL_ID", "")},
              {"name": "DROP_LOG_CHANNEL_ID", "value": os.environ.get("DROP_LOG_CHANNEL_ID", "")},
              {"name": "SYNC_API_BASE_URL", "value": os.environ.get("SYNC_API_BASE_URL", "")},
              {"name": "GOOGLE_PROJECT_ID", "value": os.environ.get("GOOGLE_PROJECT_ID", "")},
              {"name": "GOOGLE_CLIENT_EMAIL", "value": os.environ.get("GOOGLE_CLIENT_EMAIL", "")},
              {"name": "GOOGLE_SPREADSHEET_ID", "value": os.environ.get("GOOGLE_SPREADSHEET_ID", "")},
              {"name": "GOOGLE_PRIVATE_KEY", "value": os.environ.get("GOOGLE_PRIVATE_KEY", "")},
          ]

          task_def = {
              "family": "tin-bot",
              "networkMode": "awsvpc",
              "requiresCompatibilities": ["FARGATE"],
              "cpu": "256",
              "memory": "512",
              "executionRoleArn": os.environ["ECS_EXECUTION_ROLE_ARN"],
              "containerDefinitions": [
                  {
                      "name": "tin-bot",
                      "image": f"{os.environ['ECR_REGISTRY']}/{os.environ['ECR_REPOSITORY']}:latest",
                      "essential": True,
                      "logConfiguration": {
                          "logDriver": "awslogs",
                          "options": {
                              "awslogs-group": "/ecs/tin-bot",
                              "awslogs-region": "us-east-2",
                              "awslogs-stream-prefix": "ecs",
                          },
                      },
                      "environment": env_entries,
                  }
              ],
          }

          out = Path(".aws/task-definition.rendered.json")
          out.write_text(json.dumps(task_def, indent=2))
          PY
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definition.rendered.json
          container-name: tin-bot
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true